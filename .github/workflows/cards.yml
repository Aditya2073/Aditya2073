name: Update README cards

# Generates the stats / top-langs / trophy SVGs locally and commits them into
# profile/. This replaces the public Vercel instances of github-readme-stats
# and github-profile-trophy, which are currently down (503 / 402).
#
# NOTE: deliberately no `push` trigger — this workflow commits to main, and a
# push trigger would make it re-trigger itself.

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:       # run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&theme=tokyonight&bg_color=0D1117&title_color=00D4FF&icon_color=00D4FF&text_color=c9d1d9"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&theme=tokyonight&bg_color=0D1117&title_color=00D4FF&text_color=c9d1d9"

      # Pinned to a commit: the trophy action.yml only exists on master (its one
      # tag, v1.0, predates it), and this job has contents:write.
      - name: Generate trophy card
        uses: ryo-ma/github-profile-trophy@e3c89df995e92e67cdd4b2acaab9d974583dc1f7
        with:
          username: ${{ github.repository_owner }}
          output_path: profile/trophy.svg
          theme: tokyonight
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && echo "No card changes." && exit 0
          git commit -m "chore: refresh README cards"
          git push
